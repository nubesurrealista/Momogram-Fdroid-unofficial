name: Sync Momogram APKs and Update F-Droid Repo

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  sync_apks:
    runs-on: ubuntu-latest
    outputs:
      has_new_apks: ${{ steps.check_tag.outputs.has_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest release tag
        id: get_release
        run: |
          releases=$(curl -s "https://api.github.com/repos/dic1911/Momogram/releases?per_page=5")
          echo "$releases" | jq '.[0]' > release.json
          tag=$(jq -r .tag_name release.json)
          echo "tag=$tag" >> $GITHUB_ENV

      - name: Check if tag is new
        id: check_tag
        run: |
          mkdir -p .meta
          if [ ! -f .meta/last_tag.txt ]; then
            echo "none" > .meta/last_tag.txt
          fi
          last=$(cat .meta/last_tag.txt)
          if [ "$last" != "${{ env.tag }}" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Download APKs
        if: steps.check_tag.outputs.has_changes == 'true'
        run: |
          mkdir -p repo
          for ARCH in arm64-v8a armeabi-v7a; do
            url=$(jq -r --arg arch $ARCH '.assets[] | select(.name | test($arch)) | .browser_download_url' release.json)
            if [ -n "$url" ] && [ "$url" != "null" ]; then
              name=$(basename "$url")
              curl -L "$url" -o "repo/$name"
            fi
          done

      - name: Update last_tag.txt
        if: steps.check_tag.outputs.has_changes == 'true'
        run: |
          echo "${{ env.tag }}" > .meta/last_tag.txt
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add repo/ .meta/last_tag.txt
          git commit -m "Sync APKs from Momogram release ${{ env.tag }}"
          git push

  fdroid-index:
    runs-on: ubuntu-latest
    needs: sync_apks
    if: needs.sync_apks.outputs.has_new_apks == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install fdroidserver
        run: pip install fdroidserver

      - name: Restore keystore.p12
        run: echo "${{ secrets.KEYSTORE_P12_B64 }}" | base64 --decode > keystore.p12

      - name: Restore config.yml
        run: echo "${{ secrets.FDROID_CONFIG_YML }}" > config.yml

      - name: Run fdroid update
        run: fdroid update --create-metadata --verbose

      - name: Prepare files for publishing
        run: |
          mkdir publish
          cp -r repo publish/repo

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: gh-pages
          force_orphan: true
