name: Sync Momogram APKs and Update F-Droid Repo

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'repo/**'

jobs:
  sync_apks:
    runs-on: ubuntu-latest
    outputs:
      has_new_apks: ${{ steps.check_changes.outputs.has_changes }}
    
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Get latest release info (including pre-releases)
        id: get_release
        run: |
          # Busca la release más reciente, incluidas pre-releases
          releases=$(curl -s "https://api.github.com/repos/dic1911/Momogram/releases?per_page=5")
          # Busca la release más reciente (primer elemento del array)
          echo "$releases" | jq '.[0]' > release.json
          tag=$(jq -r .tag_name release.json)
          echo "tag=$tag" >> $GITHUB_ENV

      - name: Download APKs
        run: |
          mkdir -p repo
          for ARCH in arm64-v8a armeabi-v7a; do
            url=$(jq -r --arg arch $ARCH '.assets[] | select(.name | test($arch)) | .browser_download_url' release.json)
            if [ -n "$url" ] && [ "$url" != "null" ]; then
              name=$(basename "$url")
              echo "Downloading $name"
              curl -L "$url" -o "repo/$name"
            else
              echo "No APK found for $ARCH"
            fi
          done

      - name: Check if there are new APKs
        id: check_changes
        run: |
          if git diff --name-only --exit-code repo/; then
            echo "No hay cambios en los APKs"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Se encontraron nuevos APKs"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if new APKs
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add repo/
          git commit -m "Sync APKs from Momogram release ${{ env.tag }}"
          git push

  fdroid-index:
    runs-on: ubuntu-latest
    needs: sync_apks
    if: needs.sync_apks.outputs.has_new_apks == 'true'
    
    steps:
      - name: Clona el repositorio
        uses: actions/checkout@v4

      - name: Instala fdroidserver
        run: pip install fdroidserver

      - name: Restaura keystore.p12 desde secret
        run: echo "${{ secrets.KEYSTORE_P12_B64 }}" | base64 --decode > keystore.p12

      - name: Restaura config.yml desde secret
        run: |
          echo "${{ secrets.FDROID_CONFIG_YML }}" > config.yml

      - name: Ejecuta fdroid update (índice F-Droid)
        run: fdroid update --create-metadata --verbose

      - name: Prepara archivos para publicación
        run: |
          mkdir publish
          cp -r repo publish/repo

      - name: Publica en gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: gh-pages
          force_orphan: true
