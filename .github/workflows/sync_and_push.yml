name: Sync Momogram APKs and Update F-Droid Repo

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'repo/**'

jobs:
  sync_apks:
    runs-on: ubuntu-latest
    outputs:
      has_new_apks: ${{ steps.check_apks.outputs.has_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest release info
        id: get_release
        run: |
          releases=$(curl -s "https://api.github.com/repos/dic1911/Momogram/releases?per_page=5")
          echo "$releases" | jq '.[0]' > release.json
          tag=$(jq -r .tag_name release.json)
          echo "tag=$tag" >> $GITHUB_ENV

      - name: Download APKs
        run: |
          mkdir -p repo
          for ARCH in arm64-v8a armeabi-v7a; do
            url=$(jq -r --arg arch $ARCH '.assets[] | select(.name | test($arch)) | .browser_download_url' release.json)
            if [ -n "$url" ] && [ "$url" != "null" ]; then
              name=$(basename "$url")
              curl -L "$url" -o "repo/$name"
            fi
          done

      - name: Check if APKs have changed
        id: check_apks
        run: |
          git fetch origin
          git checkout origin/main
          mkdir -p old_repo
          cp -r repo/* old_repo/ || true
          changes=false
          for file in repo/*; do
            base=$(basename "$file")
            if [ ! -f "$file" ]; then continue; fi
            if ! cmp -s "$file" "old_repo/$base"; then
              changes=true
              break
            fi
          done
          echo "has_changes=$changes" >> $GITHUB_OUTPUT

      - name: Commit and push if new APKs
        if: steps.check_apks.outputs.has_changes == 'true'
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add repo/
          git commit -m "Sync APKs from Momogram release ${{ env.tag }}"
          git push

  fdroid-index:
    runs-on: ubuntu-latest
    needs: sync_apks
    if: needs.sync_apks.outputs.has_new_apks == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install fdroidserver
        run: pip install fdroidserver

      - name: Restore keystore.p12
        run: echo "${{ secrets.KEYSTORE_P12_B64 }}" | base64 --decode > keystore.p12

      - name: Restore config.yml
        run: echo "${{ secrets.FDROID_CONFIG_YML }}" > config.yml

      - name: Run fdroid update
        run: fdroid update --create-metadata --verbose

      - name: Prepare files for publishing
        run: |
          mkdir publish
          cp -r repo publish/repo

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: gh-pages
          force_orphan: true
